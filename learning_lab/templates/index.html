<!doctype html>
<html lang="en">

    <title>Learning Lab · My courses</title>
    <link
      rel="icon"
      href="{{ url_for('static',filename='mark.svg') }}"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}" />
    <script src="{{ url_for('static',filename='app.js') }}" defer></script>

  <body>
    <header class="topbar">
